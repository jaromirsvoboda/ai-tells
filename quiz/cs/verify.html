<body>
<div class="wrap">
<header class="top"><a class="home" href="./">Člověk, nebo AI?</a><nav aria-label="Web"><a data-language href="../verify.html" lang="en" hreflang="en">English</a></nav></header>
<main>
<h1>Ověřit výsledek</h1>
<p>Podle sdíleného kódu si můžete prohlédnout zaznamenaný průběh kola. Jméno a odpovědi posílá prohlížeč hráče. Záznam nepotvrzuje totožnost a nevylučuje podvádění.</p>
<form id="verify-form" class="verify-form">
<label for="result">Kód výsledku</label>
<input id="result" name="result" maxlength="9" placeholder="XXXX-XXXX" pattern="[0-9A-HJ-KM-NP-TV-Za-hj-km-np-tv-z]{4}-?[0-9A-HJ-KM-NP-TV-Za-hj-km-np-tv-z]{4}" required autocomplete="off" spellcheck="false">
<button class="btn primary" type="submit">Vyhledat výsledek</button>
</form>
<p id="verify-status" role="status"></p>
<div id="verified-result"></div>
<noscript>K vyhledání výsledku je potřeba JavaScript.</noscript>
</main>
</div>
<script src="../config.js"></script>
<script src="../verify.js"></script>
</body>
</html>
