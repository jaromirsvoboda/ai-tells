<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Verify a result · Human or AI?</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="quiz.css">
</head>
<body>
<div class="wrap">
<header class="top"><a class="home" href="./">Human or AI?</a><nav aria-label="Site"><a data-language href="cs/verify.html" lang="cs" hreflang="cs">Česky</a></nav></header>
<main>
<h1>Verify a result</h1>
<p>Look up the activity recorded for a shared result ID. Names and answers are supplied by the player’s browser; this record does not prove identity or rule out cheating.</p>
<form id="verify-form" class="verify-form">
<label for="result">Result ID</label>
<input id="result" name="result" maxlength="9" placeholder="XXXX-XXXX" pattern="[0-9A-HJ-KM-NP-TV-Za-hj-km-np-tv-z]{4}-?[0-9A-HJ-KM-NP-TV-Za-hj-km-np-tv-z]{4}" required autocomplete="off" spellcheck="false">
<button class="btn primary" type="submit">Look up result</button>
</form>
<p id="verify-status" role="status"></p>
<div id="verified-result"></div>
<noscript>This page needs JavaScript to look up a result.</noscript>
</main>
</div>
<script src="config.js"></script>
<script src="verify.js"></script>
</body>
</html>
